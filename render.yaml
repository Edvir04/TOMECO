services:
  # Node.js API Server (Port 3000)
  - type: web
    name: tomeco-api
    env: node
    plan: free
    buildCommand: cd tomeco_app && npm install
    startCommand: cd tomeco_app && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_USER
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      - key: PYTHON_OCR_HOST
        fromService:
          type: web
          name: tomeco-ocr
          property: host
      - key: PYTHON_OCR_PORT
        value: 5000

  # Laravel Admin Portal (Port 8000)
  - type: web
    name: tomeco-web-admin
    env: docker
    plan: free
    dockerfilePath: ./tomeco_web/Dockerfile.admin
    dockerContext: ./tomeco_web
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_PORTAL_TYPE
        value: admin
      - key: PORT
        value: 8000
      - key: DB_CONNECTION
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: tomeco-web-admin
          property: host
      - key: VIOLATOR_PORTAL_URL
        fromService:
          type: web
          name: tomeco-web-violator
          property: host

  # Laravel Violator Portal (Port 8001)
  - type: web
    name: tomeco-web-violator
    env: docker
    plan: free
    dockerfilePath: ./tomeco_web/Dockerfile.violator
    dockerContext: ./tomeco_web
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_PORTAL_TYPE
        value: violator
      - key: PORT
        value: 8001
      - key: DB_CONNECTION
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: tomeco-web-violator
          property: host

  # Python OCR Service (Port 5000)
  - type: web
    name: tomeco-ocr
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.ocr
    dockerContext: ./Tc_ID_Card_OCR-main/Tc_ID_Card_OCR-main
    envVars:
      - key: PORT
        value: 5000

databases:
  - name: tomeco-db
    plan: free
    databaseName: capstone_gigs
    user: tomeco_user

